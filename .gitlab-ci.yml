workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - lint
  - test
  - build
  - sonar
  - image
  - deploy

variables:
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  IMAGE_NAME: "$NEXUS_REGISTRY/threepod/frontend"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

.default_node:
  image: node:22-alpine
  tags:
    - threepod
    - ci
    - test
    - sonar
  cache:
    key: "$CI_PROJECT_NAME-npm"
    paths:
      - .npm
  before_script:
    - node --version
    - npm ci --cache .npm --prefer-offline

lint:
  extends: .default_node
  stage: lint
  script:
    - npm run lint

test:
  extends: .default_node
  stage: test
  script:
    - npm run test
  #artifacts:
   # when: always
   # paths:
    #  - coverage/
    #expire_in: 1 week

build:
  extends: .default_node
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

sonarqube:
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  stage: sonar
  tags:
    - threepod
    - ci
    - test
    - sonar
  variables:
    SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "$CI_PROJECT_NAME-sonar"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
      -Dsonar.projectKey="$SONAR_PROJECT_KEY"
      -Dsonar.host.url="$SONAR_HOST_URL"
      -Dsonar.token="$SONAR_TOKEN"
      -Dsonar.sources=src
      -Dsonar.tests=src
      -Dsonar.test.inclusions=src/**/*.test.js,src/**/*.test.jsx
  needs:
    - test
  rules:
    - if: '$SONAR_TOKEN && $SONAR_HOST_URL && $SONAR_PROJECT_KEY'

build_image:
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  stage: image
  tags:
    - threepod
    - build
    - image
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$NEXUS_REGISTRY\":{\"username\":\"$NEXUS_USERNAME\",\"password\":\"$NEXUS_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$IMAGE_NAME:$IMAGE_TAG"
      --destination "$IMAGE_NAME:$CI_COMMIT_REF_SLUG"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.+/'
    - if: '$CI_COMMIT_BRANCH == "main"'
deploy_development:
  image: alpine:3.22
  stage: deploy
  tags: [threepod, build, image]
  needs: [build_image]
  resource_group: threepod-development
  environment:
    name: development
    url: https://app.dev.threepod.langome.academy
  before_script:
    - apk add --no-cache openssh-client
    - install -d -m 700 "$HOME/.ssh"
    - cp "$DEV_SSH_KNOWN_HOSTS" "$HOME/.ssh/known_hosts"
    - chmod 600 "$DEV_SSH_PRIVATE_KEY" "$HOME/.ssh/known_hosts"
  script:
    - printf 'FRONTEND_IMAGE=%s\n' "$IMAGE_NAME:$IMAGE_TAG" > .deploy.env
    - ssh -i "$DEV_SSH_PRIVATE_KEY" -p "$DEV_DEPLOY_PORT" "$DEV_DEPLOY_USER@$DEV_DEPLOY_HOST" "mkdir -p '$DEV_DEPLOY_PATH/frontend'"
    - scp -i "$DEV_SSH_PRIVATE_KEY" -P "$DEV_DEPLOY_PORT" deploy/compose.yml .deploy.env "$DEV_DEPLOY_USER@$DEV_DEPLOY_HOST:$DEV_DEPLOY_PATH/frontend/"
    - printf '%s' "$NEXUS_PASSWORD" | ssh -i "$DEV_SSH_PRIVATE_KEY" -p "$DEV_DEPLOY_PORT" "$DEV_DEPLOY_USER@$DEV_DEPLOY_HOST" "docker login '$NEXUS_REGISTRY' --username '$NEXUS_USERNAME' --password-stdin"
    - ssh -i "$DEV_SSH_PRIVATE_KEY" -p "$DEV_DEPLOY_PORT" "$DEV_DEPLOY_USER@$DEV_DEPLOY_HOST" "cd '$DEV_DEPLOY_PATH/frontend' && chmod 600 .deploy.env && docker compose --env-file .deploy.env pull && docker compose --env-file .deploy.env up -d"
    - ssh -i "$DEV_SSH_PRIVATE_KEY" -p "$DEV_DEPLOY_PORT" "$DEV_DEPLOY_USER@$DEV_DEPLOY_HOST" "curl --fail --silent --show-error --retry 12 --retry-delay 5 http://127.0.0.1:8080/"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'


