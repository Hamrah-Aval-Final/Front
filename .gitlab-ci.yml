workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - lint
  - test
  - build
  - sonar
  - image

variables:
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  IMAGE_NAME: "$NEXUS_REGISTRY/threepod/frontend"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

.default_node:
  image: node:22-alpine
  tags:
    - threepod
    - ci
    - test
    - sonar
  cache:
    key: "$CI_PROJECT_NAME-npm"
    paths:
      - .npm
  before_script:
    - node --version
    - npm ci --cache .npm --prefer-offline

lint:
  extends: .default_node
  stage: lint
  script:
    - npm run lint

test:
  extends: .default_node
  stage: test
  script:
    - npm run test
  #artifacts:
   # when: always
   # paths:
    #  - coverage/
    #expire_in: 1 week

build:
  extends: .default_node
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

sonarqube:
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  stage: sonar
  tags:
    - threepod
    - ci
    - test
    - sonar
  variables:
    SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "$CI_PROJECT_NAME-sonar"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
      -Dsonar.projectKey="$SONAR_PROJECT_KEY"
      -Dsonar.host.url="$SONAR_HOST_URL"
      -Dsonar.token="$SONAR_TOKEN"
      -Dsonar.sources=src
      -Dsonar.tests=src
      -Dsonar.test.inclusions=src/**/*.test.js,src/**/*.test.jsx
      -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
  needs:
    - test
  rules:
    - if: '$SONAR_TOKEN && $SONAR_HOST_URL && $SONAR_PROJECT_KEY'

build_image:
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  stage: image
  tags:
    - threepod
    - build
    - image
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$NEXUS_REGISTRY\":{\"username\":\"$NEXUS_USERNAME\",\"password\":\"$NEXUS_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$IMAGE_NAME:$IMAGE_TAG"
      --destination "$IMAGE_NAME:$CI_COMMIT_REF_SLUG"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.+/'
    - if: '$CI_COMMIT_BRANCH == "main"'